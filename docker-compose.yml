services:
    app:
        build:
            args:
                user: recetas
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: recetas
        container_name: recetas-app
        tty: true
        working_dir: /var/www/
        environment:
            - DB_CONNECTION=mysql
            - DB_HOST=mariadb_db
            - DB_PORT=3306
            - DB_DATABASE=recetas
            - DB_USERNAME=root
            - DB_PASSWORD=
        volumes:
            - ./:/var/www
            - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - recetas
            - databases
        healthcheck:
            test: ["CMD", "php", "-r", "exit(0);"]
            interval: 10s
            timeout: 5s
            retries: 3
    queue:
        image: recetas
        container_name: recetas-queue
        depends_on:
            app:
                condition: service_healthy
        working_dir: /var/www/
        command: php artisan queue:work --sleep=3 --tries=1 --timeout=90
        volumes:
            - ./:/var/www
            - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - recetas
            - databases
    scheduler:
        image: recetas
        container_name: recetas-scheduler
        depends_on:
            app:
                condition: service_healthy
        working_dir: /var/www/
        command: php artisan schedule:work
        volumes:
            - ./:/var/www
            - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - recetas
            - databases
    redis:
        image: redis:8-alpine
        container_name: recetas-redis
        tty: true
        ports:
            - "6379:6379"
        volumes:
            - recetas_redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - recetas
    nginx:
        image: nginx:alpine
        container_name: recetas-nginx
        depends_on:
            app:
                condition: service_healthy
        tty: true
        ports:
            - 8000:80
        volumes:
            - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
            - ./:/var/www:ro
        networks:
            - recetas
networks:
    recetas:
        driver: bridge
    databases:
        driver: bridge
        external: true
volumes:
    recetas_redis:
        driver: local
